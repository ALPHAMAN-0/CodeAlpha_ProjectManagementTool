name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The test suite runs a real mongod supplied by mongodb-memory-server.
      # Caching the binary keeps CI from re-downloading ~100MB on every run.
      - name: Cache mongodb binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm ci

      - name: Typecheck (shared, server, client)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
